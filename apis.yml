x-coverage:
  state: covered
  reason: covered
  detail: >-
    Two institution-operated public APIs were found, probed end to end, and contracted:
    the ONE.UF Schedule of Courses API and the Smathers Libraries Patron API, both inside
    UF's own ARIN allocation under InCommon certificates, both unauthenticated, both
    entirely undocumented by UF. A self-hosted Shibboleth identity provider registered in
    InCommon and interfederated into eduGAIN was also found and recorded, carrying REFEDS
    R&S and Sirtfi commitments. Domain-standard conformance under the education regime:
    oai-pmh, shibboleth and saml conformant institution-operated, crossref registered.

    Three corrections were made against the June 2026 profile. First, the UF Digital
    Collections OAI-PMH surface it pointed at, ufdc.ufl.edu/sobekcm_oai.aspx, is a
    SOFT-404 — HTTP 200 carrying the React app shell — and the live OAI-PMH 2.0 repository
    is on a different host entirely, api.patron.uflib.ufl.edu/oai, found by reading the
    UFDC client's build-time environment module. Second, one.ufl.edu/llms.txt returns 200
    but is likewise the SPA shell, not an llms.txt, and is not credited. Third, the cohort
    DNS pass reported no CNAME tenancy for this repo; two were found by hand —
    catalog.ufl.edu CNAMEs to ufl-public.courseleaf.com and calendar.ufl.edu CNAMEs to
    ufl-prod.lwcal.com. Both are recorded as tenant relationships rather than deleted, and
    neither vendor's contract is saved here.

    What is genuinely absent: no open data portal (data.ufl.edu redirects to GatorLink
    SSO), no DataCite membership (probed, zero results), no public ORCID integration, no
    SCIM/LTI/OneRoster/Caliper/QTI surface of UF's own, no developer portal, no API
    documentation, no versioning, no changelog, no status page, no rate-limit signal and
    no terms of use for either API. The campus map JSON is live but WAF-blocked to every
    non-browser client. The UniversityofFlorida GitHub org holds three repositories, all
    untouched since 2018.
