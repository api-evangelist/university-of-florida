- aid: university-of-florida:crossref-membership
  name: Crossref Membership — UF George A. Smathers Libraries
  x-operator: registry
  description: >-
    The University of Florida George A. Smathers Libraries is a Crossref member, id 17357, depositing
    DOIs under prefix 10.32473 — 14,724 DOIs registered as of 2026-09-01. This is a registry membership,
    a machine-evidenced fact about the institution, not an API UF operates; the Crossref API belongs to
    Crossref and is not saved here. UF does NOT appear as a DataCite member or repository client — probed
    and confirmed absent.
  humanURL: https://uflib.ufl.edu/
  baseURL: https://api.crossref.org/members/17357
