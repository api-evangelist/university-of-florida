- aid: university-of-florida:canvas-lms
  name: UF Canvas LMS Tenancy
  x-operator: tenant
  description: >-
    UF's learning management system is Canvas, running on Instructure's platform at the UF-specific tenant
    ufl.instructure.com. The Canvas REST API is present on that tenant and correctly returns HTTP 401
    with a JSON error to an unauthenticated caller. The teaching data is UF's; the contract is Instructure's
    engineering and is deliberately NOT saved under this institution. Any LTI, Caliper or OneRoster conformance
    this platform demonstrates belongs to Instructure and is not credited to UF.
  humanURL: https://elearning.ufl.edu/
  baseURL: https://ufl.instructure.com/api/v1
  tags:
  - LMS
  - Canvas
  - Tenants
  - Teaching and Learning
  tags_raw:
  - LMS
  - Canvas
  - Tenant
  - Teaching and Learning
- aid: university-of-florida:course-catalog-courseleaf
  name: UF Academic Catalog (CourseLeaf tenancy)
  x-operator: tenant
  description: >-
    The UF academic catalog runs on Leepfrog's CourseLeaf platform. catalog.ufl.edu CNAMEs to ufl-public.courseleaf.com
    (12.175.6.47) — a vendor platform behind a UF hostname, which a hostname-only verdict reads as institution-operated
    and which the cohort DNS pass had recorded as no CNAME tenancy for this repo. CourseLeaf's `ribbit`
    interface responds with real UF course XML, so the surface is live and the data is UF's, but the contract
    is Leepfrog's and is not saved here.
  humanURL: https://catalog.ufl.edu/
  baseURL: https://catalog.ufl.edu/ribbit/
  tags:
  - Course Catalog
  - Tenants
  - CourseLeaf
  - Education
  tags_raw:
  - Course Catalog
  - Tenant
  - CourseLeaf
  - Education
- aid: university-of-florida:events-calendar-livewhale
  name: UF Events Calendar (LiveWhale tenancy)
  x-operator: tenant
  description: >-
    The UF events calendar runs on LiveWhale Calendar. calendar.ufl.edu CNAMEs to ufl-prod.lwcal.com —
    again a vendor platform behind a UF hostname that a hostname-only verdict would credit to UF. The
    iCalendar feed at /live/ical/events is live and returns real UF events; the JSON feed path is not
    exposed. UF's events, the vendor's contract.
  humanURL: https://calendar.ufl.edu/
  baseURL: https://calendar.ufl.edu/live/ical/events
  tags:
  - Event
  - Calendar
  - Campus Life
  - Tenants
  - LiveWhale
