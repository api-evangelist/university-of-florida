- aid: university-of-florida:campus-map
  name: UF Campus Map JSON Data
  x-operator: institution
  description: >-
    JSON datasets backing the UF interactive campus map — building footprints, bus stops, dining locations,
    parking lots and housing with coordinates and metadata. The host is UF's own (campusmap.ufl.edu, CNAME
    to virtual-l2www-prod-bb-publicssl.server.ufl.edu, 128.227.36.81) and the map itself is live, but
    the JSON is not agent-reachable: the host WAF returns HTTP 403 to every non-browser client, verified
    2026-09-01 with a full desktop Chrome User-Agent and a matching Referer. Recorded as a live but blocked
    institution surface, not as a dead one and not as an available API.
  humanURL: https://campusmap.ufl.edu/
  baseURL: https://campusmap.ufl.edu/library/cmapjson/
  tags:
  - Campus
