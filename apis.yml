apis:
- aid: university-of-florida:identity-federation
  name: UF Shibboleth Identity Provider (InCommon / eduGAIN)
  x-operator: federation
  description: >-
    The University of Florida's SAML 2.0 identity provider, entityID https://login.ufl.edu/idp/shibboleth,
    registered in InCommon and interfederated into eduGAIN. Signed SAML metadata is retrievable per-entity
    from the InCommon Metadata Query service. UF self-hosts it: login.ufl.edu resolves to 128.227.9.67
    in UF's own ARIN allocation with no CNAME, on an Internet2/InCommon certificate — unlike the federation-managed
    IdPs found under institution hostnames elsewhere in this cohort. The entity carries REFEDS Research
    & Scholarship (a machine-readable attribute-release commitment), REFEDS Sirtfi (a security-incident-response
    commitment with a contactable team), and a published Shibboleth scope of ufl.edu. A federation is
    shared by definition; the identity provider behind this entry is UF's own.
  humanURL: https://it.ufl.edu/
  baseURL: https://mdq.incommon.org/entities/https%3A%2F%2Flogin.ufl.edu%2Fidp%2Fshibboleth
  tags:
  - Identity Federation
  - Shibboleth
  - SAML
  - InCommon
  - eduGAIN
  - Authentication
