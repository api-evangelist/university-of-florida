---
aid: university-of-florida
name: University of Florida
x-type: university
x-category: Public Research University
description: >-
  The University of Florida (UF) is a public land-grant research university in Gainesville,
  Florida, United States, and a member of the Association of American Universities. UF
  publishes no developer portal, no API documentation, no terms of use and no versioning
  or changelog for anything it operates — but, unusually for this cohort, it does operate
  real machine-readable surfaces on its own infrastructure rather than only renting a
  vendor's. Two public HTTP/JSON APIs run inside UF's own ARIN allocation (128.227.0.0/16,
  NetName UFNET) under InCommon-issued certificates: the Schedule of Courses API behind
  ONE.UF, which serves the full course catalog for 49 terms with an AI-curriculum filter
  as a first-class parameter, and the Smathers Libraries Patron API behind the UF Digital
  Collections, a self-documenting 17-resource read API that also serves a conformant
  OAI-PMH 2.0 repository in Dublin Core and MODS 3.7. UF additionally runs its own
  Shibboleth identity provider, registered in InCommon and interfederated into eduGAIN
  with REFEDS Research & Scholarship and Sirtfi commitments. Everything else in UF's
  footprint is somebody else's engineering under a UF hostname — Canvas, CourseLeaf,
  LiveWhale — or is gated behind GatorLink authentication, as data.ufl.edu is.
type: Index
