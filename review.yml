  - date: '2026-09-01'
    rating: 3
    summary: >-
      Re-profiled under the university pipeline. UF operates TWO genuine public APIs on its
      own infrastructure — the ONE.UF Schedule of Courses API and the Smathers Libraries
      Patron API — plus a self-hosted Shibboleth IdP registered in InCommon. Operator was
      settled by ARIN whois on the resolved address and by TLS issuer, not by hostname:
      one.ufl.edu, api.patron.uflib.ufl.edu and login.ufl.edu all resolve into
      128.227.0.0/16 (NetName UFNET, OrgName University of Florida) with no CNAME, under
      Internet2/InCommon certificates UF procures. OpenAPI contracts were derived by
      probing; every parameter was individually verified and the twelve that did not
      demonstrably filter were recorded as unverified rather than asserted.

      THREE CORRECTIONS against the 2026-06-03 profile. (1) The UFDC OAI-PMH path this
      catalog implied, https://ufdc.ufl.edu/sobekcm_oai.aspx, is a SOFT-404 — HTTP 200
      carrying the React SPA shell. The live OAI-PMH 2.0 repository is on a different host,
      https://api.patron.uflib.ufl.edu/oai, discovered by reading the UFDC client's
      build-time environment module. (2) https://one.ufl.edu/llms.txt returns 200 and is
      also the SPA shell, not an llms.txt — not credited. (3) The cohort DNS pass reported
      no CNAME tenancy for this repo; two were found by hand, catalog.ufl.edu ->
      ufl-public.courseleaf.com and calendar.ufl.edu -> ufl-prod.lwcal.com, both recorded
      as tenant relationships.

      Evidenced absences: no DataCite membership (probed, zero results), no open data
      portal (data.ufl.edu redirects to GatorLink SSO), no developer portal, no
      documentation, no versioning, no changelog, no status page, no rate-limit signal, no
      terms of use, no security.txt. Campus map JSON is live but WAF-blocked to every
      non-browser client. No endpoints fabricated; no vendor contract saved under UF.
